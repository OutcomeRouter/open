# Synthetic task (tools/gen_tasks.py --family text --seed 1)
difficulty = 6
family = "text"
type = "synthetic-text"
task = "Write solution.py with transform(s: str) -> str that applies these steps, in this order:\n\n1. Replace each space with an underscore.\n2. Convert to uppercase.\n3. Replace every run of whitespace with a single space.\n4. If the string is longer than 40 characters, keep the first 37 and add '...'.\n5. Strip leading and trailing whitespace.\n6. Reverse the characters of each space-separated word, keeping the words in order. Words are separated by single spaces; keep empty words between consecutive spaces.\n\nUse only the Python standard library."
workdir = "work"
deadline_minutes = 15
max_attempts = 3
attempt_timeout_minutes = 7
protect = ["test_examples.py"]

[[checks]]
name = "the examples pass"
level = "tested"
cmd = "python3 test_examples.py"

[[checks]]
name = "synthetic/text hidden tests"
level = "tested"
withheld = true
cmd = "python3 {spec_dir}/checks/hidden.py"
