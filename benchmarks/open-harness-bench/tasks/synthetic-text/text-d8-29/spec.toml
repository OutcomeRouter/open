# Synthetic task (tools/gen_tasks.py --family text --seed 1)
difficulty = 8
family = "text"
type = "synthetic-text"
task = "Write solution.py with transform(s: str) -> str that applies these steps, in this order:\n\n1. Replace every run of whitespace with a single space.\n2. Replace every ASCII digit with '#'.\n3. Reverse the characters of each space-separated word, keeping the words in order. Words are separated by single spaces; keep empty words between consecutive spaces.\n4. Remove every vowel (a, e, i, o, u, in either case).\n5. Remove repeated words: keep only the first occurrence of each space-separated word (split on single spaces; compare exactly; empty words count as words).\n6. Collapse every run of the same character repeated three or more times to exactly two of it.\n7. Convert to uppercase.\n8. Replace each space with an underscore.\n\nUse only the Python standard library."
workdir = "work"
deadline_minutes = 15
max_attempts = 3
attempt_timeout_minutes = 7
protect = ["test_examples.py"]

[[checks]]
name = "the examples pass"
level = "tested"
cmd = "python3 test_examples.py"

[[checks]]
name = "synthetic/text hidden tests"
level = "tested"
withheld = true
cmd = "python3 {spec_dir}/checks/hidden.py"
