# Synthetic task (tools/gen_tasks.py --family text --seed 1)
difficulty = 7
family = "text"
type = "synthetic-text"
task = "Write solution.py with transform(s: str) -> str that applies these steps, in this order:\n\n1. Strip leading and trailing whitespace.\n2. Convert to lowercase.\n3. Reverse the order of the space-separated words (split on single spaces, keep empty words).\n4. Remove repeated words: keep only the first occurrence of each space-separated word (split on single spaces; compare exactly; empty words count as words).\n5. Collapse every run of the same character repeated three or more times to exactly two of it.\n6. Reverse the characters of each space-separated word, keeping the words in order. Words are separated by single spaces; keep empty words between consecutive spaces.\n7. Replace every run of whitespace with a single space.\n\nUse only the Python standard library."
workdir = "work"
deadline_minutes = 15
max_attempts = 3
attempt_timeout_minutes = 7
protect = ["test_examples.py"]

[[checks]]
name = "the examples pass"
level = "tested"
cmd = "python3 test_examples.py"

[[checks]]
name = "synthetic/text hidden tests"
level = "tested"
withheld = true
cmd = "python3 {spec_dir}/checks/hidden.py"
