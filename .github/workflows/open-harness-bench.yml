name: Open Harness Bench
on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/open-harness-bench/**'
      - 'formal/Clarification.*'
      - 'formal/check_clarification.py'
      - '.github/workflows/open-harness-bench.yml'
  pull_request:
    paths:
      - 'benchmarks/open-harness-bench/**'
      - 'formal/Clarification.*'
      - 'formal/check_clarification.py'
      - '.github/workflows/open-harness-bench.yml'

permissions:
  contents: read

jobs:
  benchmark-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmarks/open-harness-bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - name: Audit task fixtures
        run: |
          .venv/bin/python tools/audit_corpus.py --out "$RUNNER_TEMP/corpus-audit.json"
          diff results/corpus-audit.json "$RUNNER_TEMP/corpus-audit.json"
      - name: Reproduce paired selector results
        run: |
          .venv/bin/python tools/selection_ablation.py --out "$RUNNER_TEMP/selection.json"
          diff results/selection-ablation.json "$RUNNER_TEMP/selection.json"
      - name: Reproduce AgentScope owner decisions
        run: |
          python -m pip install uv
          uv run --python 3.12 experiments/acme/replay.py --out "$RUNNER_TEMP/acme-swarm.json"
          diff results/acme-swarm.json "$RUNNER_TEMP/acme-swarm.json"
          uv run --python 3.12 experiments/acme/compare_policies.py --out "$RUNNER_TEMP/acme-policies.json"
          diff results/acme-policies.json "$RUNNER_TEMP/acme-policies.json"
          uv run --python 3.12 experiments/acme/convergence.py --out "$RUNNER_TEMP/convergence.json"
          diff results/acme-convergence.json "$RUNNER_TEMP/convergence.json"
          uv run --python 3.12 experiments/acme/revision.py --out "$RUNNER_TEMP/acme-revisions.json"
          diff results/acme-revisions.json "$RUNNER_TEMP/acme-revisions.json"
          uv run --python 3.12 experiments/acme/amendment.py --out "$RUNNER_TEMP/acme-amendment.json"
          diff results/acme-amendment.json "$RUNNER_TEMP/acme-amendment.json"
          uv run --python 3.12 experiments/acme/late_answers.py --out "$RUNNER_TEMP/late.json"
          diff results/acme-late-answers.json "$RUNNER_TEMP/late.json"
      - name: Verify crash recovery and competing writers
        run: |
          python experiments/acme/crash_retry.py
          python experiments/acme/lost_ack.py
      - name: Check clarification invariants and three counterexamples
        working-directory: formal
        run: |
          curl --fail --silent --show-error --location https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          python check_clarification.py "$RUNNER_TEMP/tla2tools.jar"
